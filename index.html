<form method="POST" action="https://script.google.com/macros/s/AKfycbzJepxdiPCAoatId503G4Du2HaeMmF3eBhXN-MQuhnIFyWZgZ4ZSPGPP79Ug-DOapqq/exec">
  <input type="text" name="name" placeholder="Full Name" required>
  <input type="email" name="email" placeholder="Email Address">
  <select name="attending">
    <option value="Yes">Attending</option>
    <option value="No">Regretfully Decline</option>
  </select>
  <input type="number" name="guests" placeholder="Number of Guests" min="1">
  <textarea name="message" placeholder="Message to the couple"></textarea>
  <button type="submit">Submit RSVP</button>
</form>
