@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff9f5;color:#4d2730;font-family:Montserrat,sans-serif}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 18px;position:relative;overflow:hidden;background:radial-gradient(circle at 12% 18%,#f7d9d3 0 10%,transparent 28%),radial-gradient(circle at 88% 78%,#f4dfbd 0 11%,transparent 30%),linear-gradient(135deg,#fffaf7,#f7e7df)}
.hero:before,.hero:after{position:absolute;font-size:90px;opacity:.16;content:"✦"}.hero:before{top:5%;left:7%}.hero:after{right:7%;bottom:7%}
.content{max-width:900px;position:relative;z-index:2}.eyebrow{font-size:11px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:#a45a66}
.names{font:clamp(70px,13vw,140px)/.85 "Great Vibes";color:#8c3d4b;margin:24px 0 18px}.amp{font:40px "Cormorant Garamond";color:#c49560}
.hero-date{font:600 22px "Cormorant Garamond";letter-spacing:4px}.tag{font-weight:700;color:#9b5662;margin-top:16px}
.art{width:min(92vw,680px);margin:20px auto 18px;filter:drop-shadow(0 18px 28px rgba(103,52,61,.15));animation:float 4s ease-in-out infinite}.art img{width:100%;height:auto;object-fit:contain;display:block;border-radius:28px;border:7px solid rgba(255,255,255,.8)}@keyframes float{0%,100%{transform:translateY(0) rotate(-.25deg)}50%{transform:translateY(-7px) rotate(.25deg)}}
nav{position:sticky;top:0;z-index:10;display:flex;justify-content:center;gap:28px;padding:14px;background:rgba(255,250,247,.95);backdrop-filter:blur(10px);border-bottom:1px solid #ead7d1}nav a{font-size:11px;font-weight:700;color:#6e3741;text-decoration:none;letter-spacing:1px}
section{padding:78px 20px}.wrap{max-width:920px;margin:auto}.kicker{text-align:center;text-transform:uppercase;letter-spacing:4px;font-size:11px;font-weight:700;color:#b16c76}.title{text-align:center;font:600 52px "Cormorant Garamond";color:#7f3745;margin:8px 0 38px}
.invite{text-align:center;font:500 25px/1.7 "Cormorant Garamond";max-width:720px;margin:auto}.highlight{margin:40px auto 0;display:flex;justify-content:center;gap:15px;flex-wrap:wrap}.pill{padding:14px 22px;border-radius:50px;background:#fff;border:1px solid #ead8d1;font-size:12px;font-weight:700;box-shadow:0 8px 20px rgba(103,52,61,.06)}
.details{background:#f6e6e0}.detail-card{max-width:720px;margin:auto;background:#fff;border-radius:28px;padding:35px;text-align:center;box-shadow:0 15px 35px rgba(103,52,61,.08);border:1px solid #ead8d1}.detail-card h3{font:600 38px "Cormorant Garamond";color:#873b49;margin:0 0 18px}.date-big{font-size:28px;font-weight:700;letter-spacing:2px}.venue{font-weight:700;line-height:1.7;margin:20px 0 4px}.address{font-size:13px;line-height:1.8;color:#76525a}.map{display:inline-block;margin-top:18px;background:#8d3f4c;color:white;text-decoration:none;padding:12px 20px;border-radius:30px;font-size:11px;font-weight:700}
.count{min-width:100px;background:#fff;border:1px solid #ead8d1;border-radius:18px;padding:16px 12px}.count strong{display:block;font:600 35px "Cormorant Garamond";color:#8d3f4c}.count span{font-size:9px;letter-spacing:2px;text-transform:uppercase}
.rsvp{background:linear-gradient(135deg,#8d3f4c,#b96e75);color:#fff}.rsvp .kicker,.rsvp .title{color:#fff}.form{max-width:600px;margin:auto;background:rgba(255,255,255,.12);padding:28px;border-radius:25px}input,select,textarea{width:100%;padding:14px;margin:7px 0;border:0;border-radius:12px;font:14px Montserrat}button{width:100%;padding:15px;border:0;border-radius:30px;background:#f1cf9c;color:#542630;font-weight:800;cursor:pointer;margin-top:8px}
footer{text-align:center;padding:55px 20px}.footer-names{font:58px "Great Vibes";color:#8d3f4c}.footer-tag{font-weight:700}
@media(max-width:600px){.title{font-size:44px}.names{font-size:78px}.hero-date{font-size:17px}nav{gap:17px}}

}

  margin: 18px auto 0;

}
.details-soon .details-icon{font-size:24px;margin-bottom:8px}

  margin:0 0 10px;

}
.details-soon p{margin:7px 0}

#rsvp-form{width:100%;max-width:620px;margin:0 auto;display:grid;gap:10px}
#rsvp-form label{text-align:left;font-size:13px;font-weight:600;letter-spacing:.4px}
#rsvp-form input,#rsvp-form select,#rsvp-form textarea,#rsvp-form button{

}
#rsvp-form input,#rsvp-form select,#rsvp-form textarea{

}
